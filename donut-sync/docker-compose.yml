services:
  donut-sync:
    build:
      context: .
      dockerfile: Dockerfile
    image: donut-sync:local
    init: true
    restart: unless-stopped
    ports:
      - "${DONUT_SYNC_BIND:-0.0.0.0}:${PORT:-12342}:${PORT:-12342}"
    environment:
      PORT: "${PORT:-12342}"
      SYNC_TOKEN: "${SYNC_TOKEN:?Copy .env.example to .env and set SYNC_TOKEN}"
      STORAGE_DRIVER: local
      DATA_DIR: /data
      PUBLIC_URL: "${PUBLIC_URL:-}"
    volumes:
      - ./data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:${PORT:-12342}/readyz >/dev/null",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
